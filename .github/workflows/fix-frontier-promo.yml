name: Fix Frontier promo media

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-frontier-promo.yml"

permissions:
  contents: write

jobs:
  strip-attached-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Inspect original media
        run: |
          ffprobe -v error -show_entries stream=index,codec_name,codec_type:stream_disposition=attached_pic -of json public/frontier-devconsults-promo.mp4

      - name: Strip attached still-image track
        run: |
          ffmpeg -y \
            -i public/frontier-devconsults-promo.mp4 \
            -map 0:v:0 \
            -map 0:a:0? \
            -c copy \
            -movflags +faststart \
            public/frontier-devconsults-promo.clean.mp4

          mv public/frontier-devconsults-promo.clean.mp4 public/frontier-devconsults-promo.mp4

      - name: Verify clean mobile media
        run: |
          streams="$(ffprobe -v error -show_entries stream=codec_name,codec_type:stream_disposition=attached_pic -of compact=p=0:nk=0 public/frontier-devconsults-promo.mp4)"
          echo "$streams"

          video_count="$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 public/frontier-devconsults-promo.mp4 | wc -l | tr -d ' ')"
          audio_count="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 public/frontier-devconsults-promo.mp4 | wc -l | tr -d ' ')"

          test "$video_count" = "1"
          test "$audio_count" = "1"

          if ffprobe -v error -select_streams v -show_entries stream_disposition=attached_pic -of default=nw=1:nk=1 public/frontier-devconsults-promo.mp4 | grep -q '^1$'; then
            echo "Attached-picture stream still present."
            exit 1
          fi

      - name: Commit cleaned MP4
        run: |
          if git diff --quiet -- public/frontier-devconsults-promo.mp4; then
            echo "No media change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/frontier-devconsults-promo.mp4
          git commit -m "fix: strip mobile-breaking promo cover stream"
          git push origin HEAD:main
