name: Security Build Diagnostic

on:
  push:
    branches:
      - security-build-diagnostic

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
