name: Security Build Diagnostic

on:
  push:
    branches:
      - security-build-diagnostic

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        run: |
          git clone --depth 1 --branch security-build-diagnostic https://github.com/D-9ice/macsunny-ecommerce-2025.git source
          cd source
          node -v
          npm -v
      - name: Install and build
        run: |
          cd source
          npm ci
          npm run build
